[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cem-contracts"
version = "0.1.0"
description = "Contrato de la API de Consorcio en Mano: modelos Pydantic y enumeraciones de estados (fuente única, AD-06)"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.4"]

[tool.setuptools.packages.find]
include = ["cem_contracts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
