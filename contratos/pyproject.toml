[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cem-contracts"
version = "0.1.0"
description = "Contrato de la API de Consorcio en Mano: modelos Pydantic y enumeraciones de estados (fuente única, AD-06)"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.4"]

[tool.setuptools.packages.find]
include = ["cem_contracts*"]

# Las políticas de autorización (2b-3) viajan dentro del paquete: el backend instalado
# (`pip install ./contratos` en backend/Dockerfile) las lee en tiempo de ejecución.
[tool.setuptools.package-data]
cem_contracts = ["politicas_datos/*.json", "politicas_datos/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
