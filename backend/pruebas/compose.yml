# Pruebas del backend en Linux contra PostgreSQL 18 y Redis 7 reales (documento 14, §6.3),
# las mismas imágenes que producción. Desde la raíz del repositorio:
#
#   docker compose -f backend/pruebas/compose.yml run --rm --build cem-backend-pruebas
#   docker compose -f backend/pruebas/compose.yml down
#
# Sin argumentos corre pytest; con argumentos, el comando que se pase (p. ej. `ruff check ..`).
# Las bases son descartables: viven en memoria y no publican puertos en la máquina.
name: cem-pruebas

services:
  cem-postgres-pruebas:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30

  cem-redis-pruebas:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30

  # Almacén S3 compatible para probar la subida de las copias (documento 13, §17) de verdad.
  # Versity S3 Gateway sobre un directorio en memoria, en la región de OCI.
  cem-almacen-s3-pruebas:
    image: versity/versitygw:v1.0.18
    environment:
      ROOT_ACCESS_KEY_ID: clave-id-pruebas
      ROOT_SECRET_ACCESS_KEY: clave-secreta-pruebas
      VGW_REGION: sa-santiago-1
    command: ["--quiet", "posix", "/datos"]
    tmpfs:
      - /datos

  # Servidor SMTP de pruebas para `notificar.correo` (documento 13, §12.4): STARTTLS obligatorio
  # con un certificado autofirmado para su nombre (lo genera al arrancar), autenticación con un
  # usuario de prueba y "chaos" para responder 4xx o 5xx a pedido. Su API HTTP (8025) lista lo
  # que llegó. Nada sale de esta red.
  cem-correo-pruebas:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_SMTP_TLS_CERT: sans:cem-correo-pruebas
      MP_SMTP_TLS_KEY: sans:cem-correo-pruebas
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH: usuario-pruebas:clave-pruebas
      MP_ENABLE_CHAOS: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      retries: 30

  cem-backend-pruebas:
    build:
      context: ../..
      dockerfile: backend/pruebas/Dockerfile
    depends_on:
      cem-postgres-pruebas:
        condition: service_healthy
      cem-redis-pruebas:
        condition: service_healthy
      cem-almacen-s3-pruebas:
        condition: service_started
      cem-correo-pruebas:
        condition: service_healthy
    environment:
      CEM_TEST_ADMIN_URL: postgresql+psycopg://postgres:postgres@cem-postgres-pruebas:5432/postgres
      CEM_TEST_REDIS_URL: redis://cem-redis-pruebas:6379/0
      CEM_TEST_S3_ENDPOINT: http://cem-almacen-s3-pruebas:7070
      CEM_TEST_S3_REGION: sa-santiago-1
      CEM_TEST_S3_CLAVE_ID: clave-id-pruebas
      CEM_TEST_S3_CLAVE_SECRETA: clave-secreta-pruebas
      CEM_TEST_SMTP_SERVIDOR: cem-correo-pruebas
      CEM_TEST_SMTP_PUERTO: "1025"
      CEM_TEST_SMTP_USUARIO: usuario-pruebas
      CEM_TEST_SMTP_CLAVE: clave-pruebas
      CEM_TEST_CORREO_API: http://cem-correo-pruebas:8025
    volumes:
      - ../..:/src
    entrypoint: []
    command: ["pytest"]
