[project]
name = "cem-backend"
version = "0.1.0"
description = "API con las reglas del negocio de Consorcio en Mano"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requiere PostgreSQL real con las políticas de seguridad por fila activas",
    "redis: requiere Redis real (límite de tasa)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
