# Servidor estático de la PWA (cem-frontend). /api y /health no pasan por acá: el proxy de
# Coolify (Traefik) los enruta directo a cem-backend por ruta en el mismo dominio.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Si un pedido de la API llega hasta acá, el enrutamiento por ruta del proxy falló: se responde
    # 404 en vez de devolver index.html, para que el error sea visible y no un JSON inválido.
    location /api/ {
        return 404;
    }
    location = /health {
        return 404;
    }

    # Activos con hash en el nombre: inmutables un año; si no existen, 404 (nunca el index).
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/cem/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/cem/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Rutas de la SPA: lo que no es un archivo se resuelve con index.html, que nunca se cachea.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/cem/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }
}
