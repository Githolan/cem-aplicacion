# Reenvío del mismo origen al backend (documento 13, §14.5). Sin URI en proxy_pass: el backend
# recibe la ruta original. Sin búfer para SSE de trabajos largos (§11).
proxy_pass http://$backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $esquema_original;
proxy_set_header Connection "";
proxy_buffering off;
proxy_read_timeout 300s;
